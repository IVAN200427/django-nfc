{% load static %}

<nav class="navbar navbar-expand-lg bg-white shadow-sm ">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="{% url 'homepage' %}">
           <img
              src="{% static 'catalog/images/nfc_logo.jpeg' %}"
              alt="NFC Industrial"
               height="50"
              class="img-fluid">
         </a>
        <!-- Mobile Toggle -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Navbar -->
        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="mainNavbar">

            <!-- Links -->
            <ul class="navbar-nav mx-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'homepage' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item dropdown">

                    <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        id="productsDropdown"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        Products

                    </a>

                    <ul class="dropdown-menu shadow-sm border-0">

                        <li>
                            <a class="dropdown-item"
                               href="{% url 'product_list' %}">
                                All Products
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        {% for category in categories %}

                        <li>
                            <a class="dropdown-item"
                               href="{% url 'category_products' category.slug %}">
                                {{ category.name }}
                            </a>
                        </li>

                        {% endfor %}

                    </ul>

                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'about_page' %}">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contact_page' %}">
                        Contact
                    </a>
                </li>

            </ul>

            <!-- Search -->
            <form
                class="d-flex flex-column flex-lg-row gap-2 mt-4 mt-lg-0 ms-lg-4"
                method="GET"
                action="{% url 'search_products' %}">

                <input
                    class="form-control"
                    type="search"
                    name="q"
                    placeholder="Search products...">

                <button
                    class="btn btn-nfc"
                    type="submit">

                    Search

                </button>

            </form>

        </div>

    </div>
</nav>
