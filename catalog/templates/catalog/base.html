{% load static %}
<!doctype html>
<html lang="en">
  <head>

    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PAGE TITLE -->
    <title>
        {% block title %}
        NFC Industrial Engineering
        {% endblock %}
    </title>

    <!-- SEO -->
    <meta
        name="description"
        content="{% block meta_description %}Industrial engineering solutions and industrial fittings from NFC Industrial.{% endblock %}"
    >

    <meta
        name="keywords"
        content="industrial fittings, engineering, valves, pipes, NFC Industrial"
    >

    <meta name="author" content="NFC Industrial">

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website">

    <meta
        property="og:title"
        content="{% block og_title %}NFC Industrial{% endblock %}"
    >

    <meta
        property="og:description"
        content="{% block og_description %}Industrial engineering solutions from NFC Industrial{% endblock %}"
    >

    <meta
        property="og:image"
        content="{% block og_image %}{% endblock %}"
    >

    <meta property="og:url" content="{{ request.build_absolute_uri }}">

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image">

    <meta
        name="twitter:title"
        content="{% block twitter_title %}NFC Industrial{% endblock %}"
    >

    <meta
        name="twitter:description"
        content="{% block twitter_description %}Industrial engineering solutions from NFC Industrial{% endblock %}"
    >

    
    <meta
        name="twitter:image"
        content="{% block twitter_image %}{% endblock %}"
    >

    <!-- CANONICAL -->
    <link rel="canonical" href="{{ request.build_absolute_uri }}">

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/x-icon"
        href="{% static 'images/favicon.ico' %}"
    >

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>

  <body>
    <!-- NAVBAR -->
    {% include 'catalog/includes/navbar.html' %}

    <!-- MESSAGES -->

    <div class="container mt-3">
      {% if messages %} {% for message in messages %}

      <div class="alert alert-success alert-dismissible fade show">
        {{ message }}

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      {% endfor %} {% endif %}
    </div>

    <!-- MAIN CONTENT -->

    {% block content %} {% endblock %}

    <!-- FOOTER -->

    {% include 'catalog/includes/footer.html' %}

    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
